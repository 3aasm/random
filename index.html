<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="عجلة الحظ">
    
    <link rel="apple-touch-icon" href="random.png">
    <link rel="apple-touch-icon" sizes="180x180" href="random.png">
    <link rel="icon" type="image/png" href="random.png">
    <meta name="theme-color" content="#EBB305">

    <title>عجلة الحظ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --gold: #EBB305;
            --dark-bg: #181715;
            --card-bg: #2A2825;
            --bottom-wave: #363431;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark-bg);
            font-family: 'Tajawal', sans-serif;
            overflow: hidden;
            color: #ffffff;
            position: fixed;
            inset: 0;
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        /* الحاوية الرئيسية - تستخدم fixed positioning لتجنب مشكلة تغير الارتفاع في standalone mode */
        .app-shell {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            background-color: var(--dark-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* ضمان عدم تحرك المحتوى عند الفتح من الشاشة الرئيسية */
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* الجزء العلوي الأصفر */
        .top-yellow-shape {
            position: relative;
            width: 100%;
            height: 30%;
            min-height: 200px;
            max-height: 260px;
            flex-shrink: 0;
        }

        .top-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .header-content {
            position: relative;
            z-index: 2;
            padding-top: 18px;
            padding-inline: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .winner-headline {
            font-size: clamp(1.8rem, 7vw, 2.5rem);
            font-weight: 900;
            color: #141311;
            line-height: 1.15;
            letter-spacing: -0.5px;
            margin-top: 6px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .winner-sub {
            font-size: 0.9rem;
            font-weight: 700;
            color: rgba(20, 19, 17, 0.75);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .names-trigger-area {
            position: absolute;
            bottom: 12%;
            left: 16px;
            z-index: 5;
        }

        .names-btn {
            background: rgba(20, 19, 17, 0.12);
            border: 1.5px solid rgba(20, 19, 17, 0.25);
            color: #141311;
            font-weight: 800;
            font-size: 0.8rem;
            padding: 7px 12px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .names-btn:active {
            transform: scale(0.94);
            background: rgba(20, 19, 17, 0.22);
        }

        /* منطقة العجلة */
        .wheel-section {
            position: relative;
            z-index: 3;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            min-height: 0;
        }

        .wheel-card {
            position: relative;
            width: min(68vw, 290px);
            height: min(68vw, 290px);
            background: linear-gradient(145deg, rgba(235, 179, 5, 0.14), rgba(42, 40, 37, 0.6));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
            padding: 16px;
            flex-shrink: 0;
        }

        .wheel-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas#wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
            display: block;
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 28px;
            height: 32px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        .center-spin-btn {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #181715;
            border: 4px solid var(--gold);
            color: var(--gold);
            font-weight: 900;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 8;
            box-shadow: 0 6px 18px rgba(0,0,0,0.7);
            transition: transform 0.15s ease;
        }

        .center-spin-btn:active {
            transform: scale(0.9);
        }

        /* الجزء السفلي */
        .bottom-wave-section {
            position: relative;
            width: 100%;
            height: 18%;
            min-height: 110px;
            max-height: 150px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 14px;
        }

        .bottom-svg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .count-pill {
            position: absolute;
            top: 8px;
            left: 22px;
            z-index: 4;
            background-color: #46433F;
            color: #FFFFFF;
            font-weight: 800;
            font-size: 0.8rem;
            padding: 5px 14px;
            border-radius: 999px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        .bottom-action-wrap {
            position: relative;
            z-index: 4;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .spin-main-btn {
            width: 100%;
            background: var(--gold);
            color: #141311;
            font-weight: 900;
            font-size: 1.1rem;
            padding: 13px 24px;
            border-radius: 22px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(235, 179, 5, 0.25);
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .spin-main-btn:active {
            transform: scale(0.97);
        }

        .spin-main-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* النافذة المنبثقة */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 50;
            display: none;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .modal-backdrop.active {
            display: flex;
            opacity: 1;
        }

        .ios-sheet {
            width: 100%;
            max-width: 480px;
            background: #22201E;
            border-top-left-radius: 32px;
            border-top-right-radius: 32px;
            padding: 14px 22px calc(20px + var(--safe-bottom));
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            max-height: 82%;
            display: flex;
            flex-direction: column;
        }

        .modal-backdrop.active .ios-sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 42px;
            height: 5px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 99px;
            margin: 0 auto 16px;
            flex-shrink: 0;
        }

        .names-list-container {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            max-height: 34%;
            margin: 12px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-left: 4px;
        }

        .name-item {
            background: #2E2C29;
            padding: 10px 14px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .name-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #F87171;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }

        @keyframes popWinner {
            0% { transform: scale(0.85); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .winner-pop {
            animation: popWinner 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #confettiCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
        }

        /* منع التمرير في iOS */
        .no-scroll {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <canvas id="confettiCanvas"></canvas>

    <div class="app-shell">
        <div class="top-yellow-shape">
            <svg class="top-svg" viewBox="0 0 400 280" preserveAspectRatio="none">
                <path d="M 0,0 L 400,0 L 400,175 C 400,205 360,210 315,210 L 245,210 C 205,210 195,235 190,255 C 185,275 160,280 120,280 L 35,280 C 12,280 0,268 0,245 Z" fill="#EBB305"/>
            </svg>

            <div class="header-content">
                <div id="winnerDisplay" class="winner-headline">عجلة الحظ</div>
                <div id="statusSubText" class="winner-sub">
                    <span>اضغط للتدوير واختيار الفائز</span>
                </div>
            </div>

            <div class="names-trigger-area">
                <button id="openNamesBtn" class="names-btn" aria-label="إدخال الأسماء">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>الأسماء</span>
                </button>
            </div>
        </div>

        <div class="wheel-section">
            <div class="wheel-card">
                <div class="wheel-wrapper">
                    <svg class="wheel-pointer" viewBox="0 0 32 36">
                        <path d="M16 36 L2 8 C0 4 4 0 8 0 L24 0 C28 0 32 4 30 8 Z" fill="#FFFFFF" stroke="#181715" stroke-width="2.5"/>
                    </svg>
                    
                    <canvas id="wheelCanvas"></canvas>
                    
                    <button id="centerSpinBtn" class="center-spin-btn">أدر</button>
                </div>
            </div>
        </div>

        <div class="bottom-wave-section">
            <div id="countBadge" class="count-pill">3 أسماء</div>

            <svg class="bottom-svg" viewBox="0 0 400 150" preserveAspectRatio="none">
                <path d="M 0,150 L 0,70 C 0,48 25,45 65,45 L 135,45 C 165,45 175,20 205,20 L 365,20 C 388,20 400,32 400,55 L 400,150 Z" fill="#32302D"/>
            </svg>

            <div class="bottom-action-wrap">
                <button id="mainSpinBtn" class="spin-main-btn">تدوير العجلة</button>
            </div>
        </div>
    </div>

    <div id="namesModal" class="modal-backdrop">
        <div class="ios-sheet">
            <div class="sheet-handle"></div>
            
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xl font-extrabold text-white">قائمة الأسماء</h2>
                <button id="closeModalBtn" class="text-sm font-bold px-3 py-1.5 rounded-xl bg-white/10 text-amber-400">
                    تم
                </button>
            </div>

            <form id="addNameForm" class="flex gap-2">
                <input 
                    type="text" 
                    id="newNameInput" 
                    placeholder="اكتب الاسم هنا..." 
                    maxlength="25"
                    autocomplete="off"
                    class="flex-1 bg-[#181715] text-white placeholder-gray-400 px-4 py-3 rounded-2xl border border-white/10 focus:outline-none focus:border-amber-400 font-bold text-base"
                >
                <button 
                    type="submit" 
                    class="bg-[#EBB305] text-[#141311] font-extrabold px-5 py-3 rounded-2xl active:scale-95 transition-transform"
                >
                    إضافة
                </button>
            </form>

            <div id="inlineMessage" class="text-xs font-bold text-amber-400 mt-2 h-4 opacity-0 transition-opacity"></div>

            <div id="namesList" class="names-list-container"></div>

            <button id="resetDefaultBtn" class="mt-2 w-full py-2.5 rounded-xl bg-white/5 text-gray-300 text-xs font-bold hover:bg-white/10 flex-shrink-0">
                إعادة الأسماء الافتراضية
            </button>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            // منع التمرير والزوم
            document.addEventListener('touchmove', function(e) {
                if (e.target.closest('.names-list-container')) return;
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('gesturestart', function(e) {
                e.preventDefault();
            });

            const DEFAULT_NAMES = ['الاسم الاول', 'الاسم الثاني', 'الاسم الثالث'];

            const SLICE_COLORS = [
                '#EBB305',
                '#2B2926',
                '#D49B00',
                '#3D3A35',
                '#F5C842',
                '#1F1E1C',
                '#C48B00',
                '#4F4B45'
            ];

            let names = [];
            try {
                const saved = localStorage.getItem('iphone_wheel_names_v1');
                names = saved ? JSON.parse(saved) : [...DEFAULT_NAMES];
                if (!Array.isArray(names) || names.length === 0) {
                    names = [...DEFAULT_NAMES];
                }
            } catch (e) {
                names = [...DEFAULT_NAMES];
            }

            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const confettiCanvas = document.getElementById('confettiCanvas');
            const confettiCtx = confettiCanvas.getContext('2d');
            const winnerDisplay = document.getElementById('winnerDisplay');
            const statusSubText = document.getElementById('statusSubText');
            const countBadge = document.getElementById('countBadge');
            const mainSpinBtn = document.getElementById('mainSpinBtn');
            const centerSpinBtn = document.getElementById('centerSpinBtn');
            const openNamesBtn = document.getElementById('openNamesBtn');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const namesModal = document.getElementById('namesModal');
            const addNameForm = document.getElementById('addNameForm');
            const newNameInput = document.getElementById('newNameInput');
            const namesListEl = document.getElementById('namesList');
            const inlineMessage = document.getElementById('inlineMessage');
            const resetDefaultBtn = document.getElementById('resetDefaultBtn');

            let currentAngle = 0;
            let isSpinning = false;
            let audioCtx = null;
            let lastSliceIndex = -1;
            let animationFrameId = null;

            function playTickSound() {
                try {
                    if (!audioCtx) {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        if (AC) audioCtx = new AC();
                    }
                    if (!audioCtx) return;
                    if (audioCtx.state === 'suspended') audioCtx.resume();

                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(520, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.035);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.035);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.04);
                } catch (err) {}
            }

            function playWinSound() {
                try {
                    if (!audioCtx) return;
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
                        gain.gain.setValueAtTime(0.15, audioCtx.currentTime + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.25);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(audioCtx.currentTime + idx * 0.08);
                        osc.stop(audioCtx.currentTime + idx * 0.08 + 0.26);
                    });
                } catch (err) {}
            }

            function setupCanvasSize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                if (rect.width === 0) return;
                const dpr = Math.min(window.devicePixelRatio || 1, 3);
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                drawWheel();

                confettiCanvas.width = window.innerWidth * dpr;
                confettiCanvas.height = window.innerHeight * dpr;
                confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            let confettiParticles = [];
            let confettiAnimId = null;

            function launchConfetti() {
                const colors = ['#EBB305', '#FFFFFF', '#F5C842', '#FF6B6B', '#4ECDC4', '#FFE66D'];
                const width = window.innerWidth;
                const height = window.innerHeight;
                confettiParticles = [];

                for (let i = 0; i < 110; i++) {
                    const isBurst = i < 65;
                    confettiParticles.push({
                        x: isBurst ? width / 2 : Math.random() * width,
                        y: isBurst ? height * 0.35 : -10 - Math.random() * 80,
                        vx: isBurst ? (Math.random() - 0.5) * 14 : (Math.random() - 0.5) * 4,
                        vy: isBurst ? (Math.random() - 0.8) * 14 : Math.random() * 4 + 2,
                        size: Math.random() * 7 + 5,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        rotation: Math.random() * 360,
                        rotationSpeed: (Math.random() - 0.5) * 12,
                        shape: Math.random() > 0.4 ? 'rect' : 'circle',
                        opacity: 1
                    });
                }

                if (confettiAnimId) cancelAnimationFrame(confettiAnimId);

                function renderConfetti() {
                    confettiCtx.clearRect(0, 0, width, height);
                    let activeCount = 0;

                    for (let i = 0; i < confettiParticles.length; i++) {
                        const p = confettiParticles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.28;
                        p.vx *= 0.98;
                        p.rotation += p.rotationSpeed;

                        if (p.y > height * 0.8) {
                            p.opacity -= 0.025;
                        }

                        if (p.opacity > 0 && p.y < height + 30) {
                            activeCount++;
                            confettiCtx.save();
                            confettiCtx.globalAlpha = Math.max(0, p.opacity);
                            confettiCtx.translate(p.x, p.y);
                            confettiCtx.rotate((p.rotation * Math.PI) / 180);
                            confettiCtx.fillStyle = p.color;

                            if (p.shape === 'rect') {
                                confettiCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                            } else {
                                confettiCtx.beginPath();
                                confettiCtx.arc(0, 0, p.size / 2.5, 0, Math.PI * 2);
                                confettiCtx.fill();
                            }
                            confettiCtx.restore();
                        }
                    }

                    if (activeCount > 0) {
                        confettiAnimId = requestAnimationFrame(renderConfetti);
                    } else {
                        confettiCtx.clearRect(0, 0, width, height);
                    }
                }

                renderConfetti();
            }

            function drawWheel() {
                const rect = canvas.parentElement.getBoundingClientRect();
                const size = rect.width;
                if (size === 0) return;
                const center = size / 2;
                const radius = center - 4;
                const count = names.length;

                ctx.clearRect(0, 0, size, size);

                if (count === 0) return;

                const arc = (Math.PI * 2) / count;

                for (let i = 0; i < count; i++) {
                    const startAngle = currentAngle + i * arc;
                    const endAngle = startAngle + arc;
                    const bgColor = SLICE_COLORS[i % SLICE_COLORS.length];

                    ctx.beginPath();
                    ctx.moveTo(center, center);
                    ctx.arc(center, center, radius, startAngle, endAngle);
                    ctx.closePath();
                    ctx.fillStyle = bgColor;
                    ctx.fill();

                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#181715';
                    ctx.stroke();

                    ctx.save();
                    ctx.translate(center, center);
                    ctx.rotate(startAngle + arc / 2);
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';

                    const isLightBg = bgColor === '#EBB305' || bgColor === '#D49B00' || bgColor === '#F5C842';
                    ctx.fillStyle = isLightBg ? '#141311' : '#FFFFFF';

                    const fontSize = count > 8 ? 11 : count > 5 ? 13 : 15;
                    ctx.font = `800 ${fontSize}px Tajawal, sans-serif`;

                    const maxLen = count > 8 ? 10 : count > 5 ? 12 : 14;
                    const label = names[i].length > maxLen ? names[i].slice(0, maxLen) + '…' : names[i];
                    ctx.fillText(label, radius - 16, 0);
                    ctx.restore();
                }

                ctx.beginPath();
                ctx.arc(center, center, radius, 0, Math.PI * 2);
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#EBB305';
                ctx.stroke();
            }

            function getSelectedIndex() {
                const count = names.length;
                const arc = (Math.PI * 2) / count;
                const pointerAngle = (Math.PI * 1.5 - (currentAngle % (Math.PI * 2)) + Math.PI * 4) % (Math.PI * 2);
                return Math.floor(pointerAngle / arc) % count;
            }

            function spinWheel() {
                if (isSpinning || names.length < 2) {
                    if (names.length < 2) {
                        showMessage('أضف اسمين على الأقل للتدوير');
                        openModal();
                    }
                    return;
                }

                isSpinning = true;
                mainSpinBtn.disabled = true;
                openNamesBtn.disabled = true;
                winnerDisplay.classList.remove('winner-pop');
                winnerDisplay.textContent = 'جاري السحب...';
                statusSubText.textContent = 'حظاً موفقاً للجميع';

                const extraSpins = 6 + Math.random() * 5;
                const targetRotation = currentAngle + extraSpins * Math.PI * 2 + Math.random() * Math.PI * 2;
                const startRotation = currentAngle;
                const duration = 4200;
                const startTime = performance.now();

                if (animationFrameId) cancelAnimationFrame(animationFrameId);

                function animate(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 4);
                    currentAngle = startRotation + (targetRotation - startRotation) * easeOut;

                    drawWheel();

                    const currentIndex = getSelectedIndex();
                    if (currentIndex !== lastSliceIndex) {
                        playTickSound();
                        lastSliceIndex = currentIndex;
                    }

                    if (progress < 1) {
                        animationFrameId = requestAnimationFrame(animate);
                    } else {
                        finishSpin();
                    }
                }

                animationFrameId = requestAnimationFrame(animate);
            }

            function finishSpin() {
                isSpinning = false;
                mainSpinBtn.disabled = false;
                openNamesBtn.disabled = false;

                const winnerIndex = getSelectedIndex();
                const winnerName = names[winnerIndex];

                winnerDisplay.textContent = winnerName;
                winnerDisplay.classList.add('winner-pop');
                statusSubText.textContent = '🎉 الفائز المختار';
                playWinSound();
                launchConfetti();

                if (navigator.vibrate) {
                    try { navigator.vibrate([40, 30, 60]); } catch (e) {}
                }
            }

            function saveAndRender() {
                try {
                    localStorage.setItem('iphone_wheel_names_v1', JSON.stringify(names));
                } catch (e) {}

                const count = names.length;
                let label = 'أسماء';
                if (count === 1) label = 'اسم';
                else if (count === 2) label = 'اسمان';
                countBadge.textContent = `${count} ${label}`;

                renderNamesList();
                drawWheel();
            }

            function renderNamesList() {
                namesListEl.innerHTML = '';
                names.forEach((name, index) => {
                    const item = document.createElement('div');
                    item.className = 'name-item';

                    const rightPart = document.createElement('div');
                    rightPart.className = 'flex items-center overflow-hidden';

                    const dot = document.createElement('span');
                    dot.className = 'name-dot';
                    dot.style.backgroundColor = SLICE_COLORS[index % SLICE_COLORS.length];

                    const text = document.createElement('span');
                    text.className = 'truncate text-white';
                    text.textContent = name;

                    rightPart.appendChild(dot);
                    rightPart.appendChild(text);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.type = 'button';
                    delBtn.textContent = '✕';
                    delBtn.setAttribute('aria-label', 'حذف الاسم');
                    delBtn.onclick = () => {
                        if (names.length <= 2) {
                            showMessage('يجب بقاء اسمين على الأقل في العجلة');
                            return;
                        }
                        names.splice(index, 1);
                        saveAndRender();
                    };

                    item.appendChild(rightPart);
                    item.appendChild(delBtn);
                    namesListEl.appendChild(item);
                });
            }

            let messageTimeout = null;
            function showMessage(msg) {
                inlineMessage.textContent = msg;
                inlineMessage.style.opacity = '1';
                if (messageTimeout) clearTimeout(messageTimeout);
                messageTimeout = setTimeout(() => {
                    inlineMessage.style.opacity = '0';
                }, 2500);
            }

            function openModal() {
                if (isSpinning) return;
                renderNamesList();
                namesModal.classList.add('active');
                document.body.classList.add('no-scroll');
            }

            function closeModal() {
                namesModal.classList.remove('active');
                document.body.classList.remove('no-scroll');
                newNameInput.blur();
            }

            mainSpinBtn.addEventListener('click', spinWheel);
            centerSpinBtn.addEventListener('click', spinWheel);
            openNamesBtn.addEventListener('click', openModal);
            closeModalBtn.addEventListener('click', closeModal);

            namesModal.addEventListener('click', (e) => {
                if (e.target === namesModal) closeModal();
            });

            addNameForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const val = newNameInput.value.trim();
                if (!val) return;
                names.push(val);
                newNameInput.value = '';
                saveAndRender();
                namesListEl.scrollTop = namesListEl.scrollHeight;
            });

            resetDefaultBtn.addEventListener('click', () => {
                names = [...DEFAULT_NAMES];
                winnerDisplay.textContent = 'عجلة الحظ';
                statusSubText.textContent = 'اضغط للتدوير واختيار الفائز';
                saveAndRender();
                showMessage('تمت استعادة الأسماء الافتراضية');
            });

            // معالجة تغيير الحجم مع debounce
            let resizeTimeout = null;
            function handleResize() {
                if (resizeTimeout) clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    setupCanvasSize();
                }, 100);
            }

            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', () => {
                setTimeout(setupCanvasSize, 300);
            });

            // معالجة تغيرات viewport في iOS standalone
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', handleResize);
                window.visualViewport.addEventListener('scroll', () => {
                    window.scrollTo(0, 0);
                });
            }

            // التهيئة
            function init() {
                setupCanvasSize();
                saveAndRender();
                
                // إعادة رسم بعد تحميل الخط
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(() => {
                        drawWheel();
                    });
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            // إعادة الرسم عند العودة للتطبيق
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    setTimeout(() => {
                        setupCanvasSize();
                    }, 100);
                }
            });

            // منع التمرير في body
            document.body.addEventListener('touchmove', function(e) {
                if (e.target.closest('.names-list-container')) return;
                if (e.target.closest('.ios-sheet')) return;
                e.preventDefault();
            }, { passive: false });

        })();
    </script>
</body>
</html>
