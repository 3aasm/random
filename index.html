<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Fortune App</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #f5c815 0%, #3a3a3c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* هيكل الهاتف */
        .phone-frame {
            width: 380px;
            height: 780px;
            background-color: #1c1c1e;
            border-radius: 55px;
            border: 12px solid #000;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* القسم الأصفر العلوي */
        .top-section {
            background-color: #f5c815;
            height: 38%;
            border-bottom-right-radius: 70px;
            padding: 40px 25px;
            color: #000;
            position: relative;
            transition: all 0.3s ease;
        }

        .time {
            font-size: 65px;
            font-weight: 700;
            text-align: center;
            line-height: 1;
            letter-spacing: -2px;
        }

        .date-weather {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 5px;
        }

        .brand {
            position: absolute;
            bottom: 25px;
            right: 25px;
            font-size: 12px;
            font-weight: 700;
        }

        /* القسم السفلي الداكن */
        .bottom-section {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* شاشة الخيارات الأولى */
        .options-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
            transition: opacity 0.3s ease;
        }

        .option-btn {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .option-btn:hover {
            background-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .option-btn.main-option {
            background-color: #f5c815;
            color: #000;
            height: 100px;
            font-size: 24px;
            box-shadow: 0 10px 20px rgba(245, 200, 21, 0.2);
        }

        /* شاشة العجلة (مخفية في البداية) */
        .wheel-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin-top: 10px;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #f5c815;
            z-index: 10;
        }

        .spin-btn {
            background-color: #f5c815;
            color: #000;
            border: none;
            padding: 12px 40px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(245, 200, 21, 0.3);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            z-index: 100;
        }

        .result-text {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            min-height: 35px;
            margin-top: 10px;
            color: #f5c815;
        }

        /* شريط الأيقونات السفلي (Dock) */
        .dock {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .dock-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 20px;
        }

        /* إخفاء واظهار العناصر */
        .hidden {
            display: none !important;
        }

    </style>
</head>
<body>

    <div class="phone-frame">
        
        <!-- الشاشة العلوية -->
        <div class="top-section">
            <div class="time" id="clock">05:37</div>
            <div class="date-weather">
                <span>dom 14 dicembre</span>
                <span>🌙 4°C</span>
            </div>
            <div class="brand">GooGLe by Steve War</div>
        </div>

        <!-- الشاشة السفلية -->
        <div class="bottom-section">
            
            <!-- الشاشة الأولى: الخيارات -->
            <div class="options-screen" id="optionsScreen">
                <div class="option-btn main-option" onclick="startWheel()">
                    🎡 عجلة الحظ
                </div>
                <div class="option-btn" onclick="startWheel()">
                    📝 من اختيارك (1)
                </div>
                <div class="option-btn" onclick="startWheel()">
                    📝 من اختيارك (2)
                </div>
            </div>

            <!-- الشاشة الثانية: العجلة -->
            <div class="wheel-screen" id="wheelScreen">
                <button class="back-btn" onclick="goBack()">رجوع</button>
                <div class="wheel-container">
                    <div class="pointer"></div>
                    <canvas id="wheelCanvas" width="500" height="500"></canvas>
                </div>
                <div class="result-text" id="resultText">اسحب العجلة للبدء</div>
                <button class="spin-btn" id="spinBtn" onclick="spinWheel()">أدر العجلة!</button>
            </div>

            <!-- شريط الأيقونات (Dock) -->
            <div class="dock">
                <div class="dock-icon">📞</div>
                <div class="dock-icon">💬</div>
                <div class="dock-icon">🧭</div>
                <div class="dock-icon">⚙️</div>
                <div class="dock-icon">📷</div>
            </div>

        </div>
    </div>

    <script>
        // تحديث الساعة في الأعلى
        function updateClock() {
            const now = new Date();
            let hours = now.getHours().toString().padStart(2, '0');
            let minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // بيانات العجلة (الأسماء)
        const names = ["أحمد", "سارة", "محمد", "ليلى", "عمر", "نور", "خالد", "مريم"];
        const colors = ["#2C2C2E", "#f5c815", "#4a4a4c", "#d4a90e", "#3a3a3c", "#e0b511", "#5a5a5c", "#c49b0b"];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultText = document.getElementById('resultText');
        
        let currentAngle = 0;
        let isSpinning = false;

        // رسم العجلة
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            const sliceAngle = (2 * Math.PI) / names.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < names.length; i++) {
                const startAngle = currentAngle + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // رسم القطاع
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.strokeStyle = "#1c1c1e";
                ctx.lineWidth = 2;
                ctx.stroke();

                // كتابة النص
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = i % 2 === 0 ? "#fff" : "#000"; // لون النص حسب لون الخلفية
                ctx.font = "bold 24px Cairo";
                ctx.fillText(names[i], radius - 30, 10);
                ctx.restore();
            }

            // رسم الدائرة في المنتصف
            ctx.beginPath();
            ctx.arc(centerX, centerY, 40, 0, 2 * Math.PI);
            ctx.fillStyle = "#1c1c1e";
            ctx.fill();
            ctx.strokeStyle = "#f5c815";
            ctx.lineWidth = 5;
            ctx.stroke();
        }

        // التنقل بين الشاشات
        function startWheel() {
            document.getElementById('optionsScreen').style.display = 'none';
            const wheelScreen = document.getElementById('wheelScreen');
            wheelScreen.style.display = 'flex';
            setTimeout(() => wheelScreen.style.opacity = '1', 10);
            drawWheel();
        }

        function goBack() {
            const wheelScreen = document.getElementById('wheelScreen');
            wheelScreen.style.opacity = '0';
            setTimeout(() => {
                wheelScreen.style.display = 'none';
                document.getElementById('optionsScreen').style.display = 'flex';
                resultText.innerText = "اسحب العجلة للبدء";
                spinBtn.disabled = false;
            }, 300);
        }

        // دوران العجلة
        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            resultText.innerText = "جاري الاختيار...";

            // سرعة عشوائية ومدة عشوائية
            const spinDuration = 4000 + Math.random() * 2000; 
            const totalRotation = (10 + Math.random() * 10) * 2 * Math.PI; // 10 إلى 20 لفة
            const startTime = performance.now();
            const startAngle = currentAngle;

            function animateSpin(time) {
                const elapsed = time - startTime;
                if (elapsed < spinDuration) {
                    // تأثير التباطؤ (Ease out)
                    const progress = 1 - Math.pow(1 - (elapsed / spinDuration), 4);
                    currentAngle = startAngle + totalRotation * progress;
                    drawWheel();
                    requestAnimationFrame(animateSpin);
                } else {
                    // انتهى الدوران
                    currentAngle = startAngle + totalRotation;
                    drawWheel();
                    isSpinning = false;
                    spinBtn.disabled = false;
                    determineWinner();
                }
            }
            requestAnimationFrame(animateSpin);
        }

        // تحديد الفائز
        function determineWinner() {
            // المؤشر في الأعلى (زاوية 270 درجة أو 1.5 باي)
            // نحسب الزاوية الحالية ونرى أي قطاع يقع تحتها
            const pointerAngle = 1.5 * Math.PI; // أعلى الدائرة
            
            // تطبيع الزاوية الحالية لتكون بين 0 و 2 باي
            let normalizedAngle = currentAngle % (2 * Math.PI);
            if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

            // حساب القطاع الذي يشير إليه المؤشر
            // المؤشر في الأعلى، لذا نحتاج لقلب الحساب قليلاً
            let angleToCheck = pointerAngle - normalizedAngle;
            if (angleToCheck < 0) angleToCheck += 2 * Math.PI;

            const sliceAngle = (2 * Math.PI) / names.length;
            const winningIndex = Math.floor(angleToCheck / sliceAngle);

            // التأكد من أن الفهرس داخل النطاق
            const finalIndex = winningIndex % names.length;
            
            resultText.innerText = `الفائز هو: ${names[finalIndex]} 🎉`;
            resultText.style.color = "#f5c815";
        }

    </script>
</body>
</html>
