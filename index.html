<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- إعدادات شاشة الآيفون ومنع التكبير وتثبيت الشاشة لمنع القفزات عند إعادة الفتح -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- إعدادات تحويل الموقع إلى تطبيق آيفون عند إضافته للشاشة الرئيسية -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="عجلة الحظ">
    
    <!-- الأيقونة -->
    <link rel="apple-touch-icon" href="random.png">
    <link rel="apple-touch-icon" sizes="180x180" href="random.png">
    <link rel="icon" type="image/png" href="random.png">
    <meta name="theme-color" content="#EBB305">

    <title>عجلة الحظ الاحترافية</title>

    <!-- خط تجوال العربي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- مكتبة Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --gold: #EBB305;
            --dark-bg: #181715;
            --card-bg: #2A2825;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* تثبيت الـ html و body لمنع أي تحرك أو قفزات رأسية عند فتح وإغلاق PWA على الآيفون */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            position: fixed;
            overflow: hidden;
            background-color: var(--dark-bg);
            font-family: 'Tajawal', sans-serif;
            color: #ffffff;
            touch-action: none;
            overscroll-behavior: none;
        }

        /* حاوية التطبيق الرئيسية المطلقة لمنع أي تغيير في الارتفاع */
        .app-shell {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* الشكل الهندسي العلوي الأصفر */
        .top-yellow-shape {
            position: relative;
            width: 100%;
            height: 31dvh;
            min-height: 195px;
            z-index: 1;
            flex-shrink: 0;
        }

        .top-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .header-content {
            position: relative;
            z-index: 2;
            padding-top: calc(env(safe-area-inset-top, 16px) + 14px);
            padding-inline: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .winner-headline {
            font-size: clamp(1.8rem, 7.5vw, 2.5rem);
            font-weight: 900;
            color: #141311;
            line-height: 1.15;
            letter-spacing: -0.5px;
            margin-top: 4px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .winner-sub {
            font-size: 0.9rem;
            font-weight: 700;
            color: rgba(20, 19, 17, 0.78);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* أزرار التحكم العلوية (إدخال الأسماء + السجل) */
        .top-actions-area {
            position: absolute;
            bottom: 12%;
            left: 14px;
            right: 14px;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-chip {
            background: rgba(20, 19, 17, 0.14);
            border: 1.5px solid rgba(20, 19, 17, 0.25);
            color: #141311;
            font-weight: 800;
            font-size: 0.82rem;
            padding: 7px 12px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .action-chip:active {
            transform: scale(0.94);
            background: rgba(20, 19, 17, 0.24);
        }

        /* منطقة عجلة الحظ في المنتصف */
        .wheel-section {
            position: relative;
            z-index: 3;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            margin-top: -10px;
        }

        .wheel-card {
            position: relative;
            width: min(72vw, 290px);
            height: min(72vw, 290px);
            background: linear-gradient(145deg, rgba(235, 179, 5, 0.12), rgba(42, 40, 37, 0.5));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.4);
            padding: 14px;
        }

        .wheel-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas#wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.45));
        }

        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 26px;
            height: 30px;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.6));
        }

        .center-spin-btn {
            position: absolute;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #181715;
            border: 3.5px solid var(--gold);
            color: var(--gold);
            font-weight: 900;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 8;
            box-shadow: 0 5px 15px rgba(0,0,0,0.65);
            transition: transform 0.15s ease;
        }

        .center-spin-btn:active {
            transform: scale(0.9);
        }

        /* الجزء السفلي المموج */
        .bottom-wave-section {
            position: relative;
            width: 100%;
            height: 18dvh;
            min-height: 110px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: calc(env(safe-area-inset-bottom, 14px) + 12px);
        }

        .bottom-svg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .count-pill {
            position: absolute;
            top: 6px;
            left: 20px;
            z-index: 4;
            background-color: #46433F;
            color: #FFFFFF;
            font-weight: 800;
            font-size: 0.8rem;
            padding: 5px 14px;
            border-radius: 999px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.25);
        }

        .bottom-action-wrap {
            position: relative;
            z-index: 4;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .spin-main-btn {
            width: 100%;
            background: var(--gold);
            color: #141311;
            font-weight: 900;
            font-size: 1.1rem;
            padding: 13px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(235, 179, 5, 0.25);
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .spin-main-btn:active {
            transform: scale(0.97);
        }

        .spin-main-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* النوافذ المنبثقة (Bottom Sheets) */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(6px);
            z-index: 50;
            display: none;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .modal-backdrop.active {
            display: flex;
            opacity: 1;
        }

        .ios-sheet {
            width: 100%;
            max-width: 480px;
            background: #22201E;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            padding: 14px 20px calc(env(safe-area-inset-bottom, 18px) + 18px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            max-height: 85dvh;
            display: flex;
            flex-direction: column;
        }

        .modal-backdrop.active .ios-sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 99px;
            margin: 0 auto 14px;
        }

        .list-container {
            overflow-y: auto;
            max-height: 36dvh;
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-left: 2px;
        }

        .list-item {
            background: #2E2C29;
            padding: 10px 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .name-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #F87171;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }

        @keyframes popWinner {
            0% { transform: scale(0.85); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .winner-pop {
            animation: popWinner 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #confettiCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 40;
        }
    </style>
</head>
<body>

    <!-- كانفاس المفرقعات -->
    <canvas id="confettiCanvas"></canvas>

    <div class="app-shell">
        <!-- 1. الجزء العلوي الأصفر -->
        <div class="top-yellow-shape">
            <svg class="top-svg" viewBox="0 0 400 280" preserveAspectRatio="none">
                <path d="M 0,0 L 400,0 L 400,175 C 400,205 360,210 315,210 L 245,210 C 205,210 195,235 190,255 C 185,275 160,280 120,280 L 35,280 C 12,280 0,268 0,245 Z" fill="#EBB305"/>
            </svg>

            <div class="header-content">
                <div id="winnerDisplay" class="winner-headline">عجلة الحظ</div>
                <div id="statusSubText" class="winner-sub">
                    <span>اضغط للتدوير واختيار الفائز</span>
                </div>
            </div>

            <!-- أزرار التحكم السريعة العلوية -->
            <div class="top-actions-area">
                <button id="openNamesBtn" class="action-chip" aria-label="إدخال الأسماء">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span>الأسماء</span>
                </button>

                <div class="flex gap-2">
                    <button id="openHistoryBtn" class="action-chip" aria-label="سجل الفائزين">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span>السجل</span>
                    </button>
                    <button id="openSettingsBtn" class="action-chip" aria-label="الإعدادات">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. عجلة الحظ -->
        <div class="wheel-section">
            <div class="wheel-card">
                <div class="wheel-wrapper">
                    <svg class="wheel-pointer" viewBox="0 0 32 36">
                        <path d="M16 36 L2 8 C0 4 4 0 8 0 L24 0 C28 0 32 4 30 8 Z" fill="#FFFFFF" stroke="#181715" stroke-width="2.5"/>
                    </svg>
                    
                    <canvas id="wheelCanvas"></canvas>
                    
                    <button id="centerSpinBtn" class="center-spin-btn">أدر</button>
                </div>
            </div>
        </div>

        <!-- 3. الجزء السفلي المموج -->
        <div class="bottom-wave-section">
            <div id="countBadge" class="count-pill">3 أسماء</div>

            <svg class="bottom-svg" viewBox="0 0 400 150" preserveAspectRatio="none">
                <path d="M 0,150 L 0,70 C 0,48 25,45 65,45 L 135,45 C 165,45 175,20 205,20 L 365,20 C 388,20 400,32 400,55 L 400,150 Z" fill="#32302D"/>
            </svg>

            <div class="bottom-action-wrap">
                <button id="mainSpinBtn" class="spin-main-btn">تدوير العجلة</button>
            </div>
        </div>
    </div>

    <!-- نافذة إدارة الأسماء -->
    <div id="namesModal" class="modal-backdrop">
        <div class="ios-sheet">
            <div class="sheet-handle"></div>
            
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-lg font-extrabold text-white">إدارة الأسماء</h2>
                <button id="closeNamesModal" class="text-sm font-bold px-3 py-1.5 rounded-xl bg-white/10 text-amber-400">
                    تم
                </button>
            </div>

            <form id="addNameForm" class="flex gap-2">
                <input 
                    type="text" 
                    id="newNameInput" 
                    placeholder="اكتب اسم جديد..." 
                    maxlength="25"
                    autocomplete="off"
                    class="flex-1 bg-[#181715] text-white placeholder-gray-400 px-4 py-2.5 rounded-2xl border border-white/10 focus:outline-none focus:border-amber-400 font-bold text-sm"
                >
                <button 
                    type="submit" 
                    class="bg-[#EBB305] text-[#141311] font-extrabold px-4 py-2.5 rounded-2xl text-sm active:scale-95 transition-transform"
                >
                    إضافة
                </button>
            </form>

            <div id="inlineMessage" class="text-xs font-bold text-amber-400 mt-2 h-4 opacity-0 transition-opacity"></div>

            <div id="namesList" class="list-container"></div>

            <div class="flex gap-2 mt-2">
                <button id="loadPresetBtn" class="flex-1 py-2 rounded-xl bg-white/5 text-amber-400 text-xs font-bold hover:bg-white/10">
                    قوالب جاهزة
                </button>
                <button id="resetDefaultBtn" class="flex-1 py-2 rounded-xl bg-white/5 text-gray-300 text-xs font-bold hover:bg-white/10">
                    الافتراضية
                </button>
            </div>
        </div>
    </div>

    <!-- نافذة سجل الفائزين -->
    <div id="historyModal" class="modal-backdrop">
        <div class="ios-sheet">
            <div class="sheet-handle"></div>
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-lg font-extrabold text-white">سجل الفائزين</h2>
                <button id="closeHistoryModal" class="text-sm font-bold px-3 py-1.5 rounded-xl bg-white/10 text-amber-400">
                    إغلاق
                </button>
            </div>
            <div id="historyList" class="list-container"></div>
            <button id="clearHistoryBtn" class="mt-2 w-full py-2.5 rounded-xl bg-red-500/15 text-red-400 text-xs font-bold">
                مسح السجل
            </button>
        </div>
    </div>

    <!-- نافذة الإعدادات -->
    <div id="settingsModal" class="modal-backdrop">
        <div class="ios-sheet">
            <div class="sheet-handle"></div>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-extrabold text-white">الإعدادات</h2>
                <button id="closeSettingsModal" class="text-sm font-bold px-3 py-1.5 rounded-xl bg-white/10 text-amber-400">
                    تم
                </button>
            </div>
            <div class="flex flex-col gap-3">
                <div class="flex items-center justify-between bg-[#2E2C29] p-3.5 rounded-2xl">
                    <span class="font-bold text-sm">الأصوات التفاعلية</span>
                    <input type="checkbox" id="soundToggle" class="w-5 h-5 accent-amber-400 rounded cursor-pointer" checked>
                </div>
                <div class="flex items-center justify-between bg-[#2E2C29] p-3.5 rounded-2xl">
                    <span class="font-bold text-sm">الاهتزاز (Haptics)</span>
                    <input type="checkbox" id="vibrateToggle" class="w-5 h-5 accent-amber-400 rounded cursor-pointer" checked>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة القوالب السريعة -->
    <div id="presetModal" class="modal-backdrop">
        <div class="ios-sheet">
            <div class="sheet-handle"></div>
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-lg font-extrabold text-white">اختر قائمة جاهزة</h2>
                <button id="closePresetModal" class="text-sm font-bold px-3 py-1.5 rounded-xl bg-white/10 text-amber-400">
                    إلغاء
                </button>
            </div>
            <div class="flex flex-col gap-2 mt-1">
                <button class="preset-choice bg-[#2E2C29] p-3 rounded-xl font-bold text-right hover:bg-white/10" data-preset="students">أسماء الطلاب (أحمد، محمد، فاطمة، سارة، خالد)</button>
                <button class="preset-choice bg-[#2E2C29] p-3 rounded-xl font-bold text-right hover:bg-white/10" data-preset="yesno">نعم أو لا (نعم، لا، ربما، بالتأكيد)</button>
                <button class="preset-choice bg-[#2E2C29] p-3 rounded-xl font-bold text-right hover:bg-white/10" data-preset="numbers">أرقام (الخيار 1، الخيار 2، الخيار 3، الخيار 4)</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const DEFAULT_NAMES = ['الاسم الاول', 'الاسم الثاني', 'الاسم الثالث'];
            const SLICE_COLORS = [
                '#EBB305', '#2B2926', '#D49B00', '#3D3A35', 
                '#F5C842', '#1F1E1C', '#C48B00', '#4F4B45'
            ];

            // استرجاع البيانات أو الافتراضية
            let names = [];
            let history = [];
            let settings = { sound: true, vibrate: true };

            try {
                const savedNames = localStorage.getItem('iphone_wheel_names_v2');
                names = savedNames ? JSON.parse(savedNames) : [...DEFAULT_NAMES];
                if (!Array.isArray(names) || names.length === 0) names = [...DEFAULT_NAMES];

                const savedHistory = localStorage.getItem('iphone_wheel_history_v2');
                history = savedHistory ? JSON.parse(savedHistory) : [];

                const savedSettings = localStorage.getItem('iphone_wheel_settings_v2');
                if (savedSettings) settings = JSON.parse(savedSettings);
            } catch (e) {
                names = [...DEFAULT_NAMES];
            }

            // عناصر الواجهة
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const confettiCanvas = document.getElementById('confettiCanvas');
            const confettiCtx = confettiCanvas.getContext('2d');
            const winnerDisplay = document.getElementById('winnerDisplay');
            const statusSubText = document.getElementById('statusSubText');
            const countBadge = document.getElementById('countBadge');
            const mainSpinBtn = document.getElementById('mainSpinBtn');
            const centerSpinBtn = document.getElementById('centerSpinBtn');

            // المودالات وأزرارها
            const namesModal = document.getElementById('namesModal');
            const historyModal = document.getElementById('historyModal');
            const settingsModal = document.getElementById('settingsModal');
            const presetModal = document.getElementById('presetModal');

            const openNamesBtn = document.getElementById('openNamesBtn');
            const openHistoryBtn = document.getElementById('openHistoryBtn');
            const openSettingsBtn = document.getElementById('openSettingsBtn');
            const loadPresetBtn = document.getElementById('loadPresetBtn');

            const closeNamesModal = document.getElementById('closeNamesModal');
            const closeHistoryModal = document.getElementById('closeHistoryModal');
            const closeSettingsModal = document.getElementById('closeSettingsModal');
            const closePresetModal = document.getElementById('closePresetModal');

            const addNameForm = document.getElementById('addNameForm');
            const newNameInput = document.getElementById('newNameInput');
            const namesListEl = document.getElementById('namesList');
            const historyListEl = document.getElementById('historyList');
            const inlineMessage = document.getElementById('inlineMessage');
            const resetDefaultBtn = document.getElementById('resetDefaultBtn');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');
            const soundToggle = document.getElementById('soundToggle');
            const vibrateToggle = document.getElementById('vibrateToggle');

            soundToggle.checked = settings.sound;
            vibrateToggle.checked = settings.vibrate;

            let currentAngle = 0;
            let isSpinning = false;
            let audioCtx = null;
            let lastSliceIndex = -1;

            soundToggle.addEventListener('change', (e) => {
                settings.sound = e.target.checked;
                saveSettings();
            });

            vibrateToggle.addEventListener('change', (e) => {
                settings.vibrate = e.target.checked;
                saveSettings();
            });

            function saveSettings() {
                try { localStorage.setItem('iphone_wheel_settings_v2', JSON.stringify(settings)); } catch(e){}
            }

            function playTickSound() {
                if (!settings.sound) return;
                try {
                    if (!audioCtx) {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (AudioContext) audioCtx = new AudioContext();
                    }
                    if (!audioCtx) return;
                    if (audioCtx.state === 'suspended') audioCtx.resume();

                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(520, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.035);

                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.035);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.04);
                } catch (err) {}
            }

            function playWinSound() {
                if (!settings.sound) return;
                try {
                    if (!audioCtx) return;
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
                        gain.gain.setValueAtTime(0.15, audioCtx.currentTime + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.25);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(audioCtx.currentTime + idx * 0.08);
                        osc.stop(audioCtx.currentTime + idx * 0.08 + 0.26);
                    });
                } catch (err) {}
            }

            function setupCanvasSize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 3);
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                drawWheel();

                confettiCanvas.width = window.innerWidth * dpr;
                confettiCanvas.height = window.innerHeight * dpr;
                confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            let confettiParticles = [];
            let confettiAnimId = null;

            function launchConfetti() {
                const colors = ['#EBB305', '#FFFFFF', '#F5C842', '#FF6B6B', '#4ECDC4', '#FFE66D'];
                const width = window.innerWidth;
                const height = window.innerHeight;
                confettiParticles = [];

                for (let i = 0; i < 110; i++) {
                    const isBurst = i < 65;
                    confettiParticles.push({
                        x: isBurst ? width / 2 : Math.random() * width,
                        y: isBurst ? height * 0.35 : -10 - Math.random() * 80,
                        vx: isBurst ? (Math.random() - 0.5) * 14 : (Math.random() - 0.5) * 4,
                        vy: isBurst ? (Math.random() - 0.8) * 14 : Math.random() * 4 + 2,
                        size: Math.random() * 7 + 5,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        rotation: Math.random() * 360,
                        rotationSpeed: (Math.random() - 0.5) * 12,
                        shape: Math.random() > 0.4 ? 'rect' : 'circle',
                        opacity: 1
                    });
                }

                if (confettiAnimId) cancelAnimationFrame(confettiAnimId);

                function renderConfetti() {
                    confettiCtx.clearRect(0, 0, width, height);
                    let activeCount = 0;

                    for (let i = 0; i < confettiParticles.length; i++) {
                        const p = confettiParticles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.28;
                        p.vx *= 0.98;
                        p.rotation += p.rotationSpeed;

                        if (p.y > height * 0.8) p.opacity -= 0.025;

                        if (p.opacity > 0 && p.y < height + 30) {
                            activeCount++;
                            confettiCtx.save();
                            confettiCtx.globalAlpha = Math.max(0, p.opacity);
                            confettiCtx.translate(p.x, p.y);
                            confettiCtx.rotate((p.rotation * Math.PI) / 180);
                            confettiCtx.fillStyle = p.color;

                            if (p.shape === 'rect') {
                                confettiCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                            } else {
                                confettiCtx.beginPath();
                                confettiCtx.arc(0, 0, p.size / 2.5, 0, Math.PI * 2);
                                confettiCtx.fill();
                            }
                            confettiCtx.restore();
                        }
                    }

                    if (activeCount > 0) {
                        confettiAnimId = requestAnimationFrame(renderConfetti);
                    } else {
                        confettiCtx.clearRect(0, 0, width, height);
                    }
                }

                renderConfetti();
            }

            function drawWheel() {
                const rect = canvas.parentElement.getBoundingClientRect();
                const size = rect.width;
                const center = size / 2;
                const radius = center - 4;
                const count = names.length;

                ctx.clearRect(0, 0, size, size);
                if (count === 0) return;

                const arc = (Math.PI * 2) / count;

                for (let i = 0; i < count; i++) {
                    const startAngle = currentAngle + i * arc;
                    const endAngle = startAngle + arc;
                    const bgColor = SLICE_COLORS[i % SLICE_COLORS.length];

                    ctx.beginPath();
                    ctx.moveTo(center, center);
                    ctx.arc(center, center, radius, startAngle, endAngle);
                    ctx.closePath();
                    ctx.fillStyle = bgColor;
                    ctx.fill();

                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#181715';
                    ctx.stroke();

                    ctx.save();
                    ctx.translate(center, center);
                    ctx.rotate(startAngle + arc / 2);
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';

                    const isLightBg = bgColor === '#EBB305' || bgColor === '#D49B00' || bgColor === '#F5C842';
                    ctx.fillStyle = isLightBg ? '#141311' : '#FFFFFF';

                    const fontSize = count > 8 ? 12 : count > 5 ? 14 : 16;
                    ctx.font = `800 ${fontSize}px Tajawal, sans-serif`;

                    const label = names[i].length > 14 ? names[i].slice(0, 13) + '…' : names[i];
                    ctx.fillText(label, radius - 16, 0);
                    ctx.restore();
                }

                ctx.beginPath();
                ctx.arc(center, center, radius, 0, Math.PI * 2);
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#EBB305';
                ctx.stroke();
            }

            function getSelectedIndex() {
                const count = names.length;
                const arc = (Math.PI * 2) / count;
                const pointerAngle = (Math.PI * 1.5 - (currentAngle % (Math.PI * 2)) + Math.PI * 4) % (Math.PI * 2);
                return Math.floor(pointerAngle / arc) % count;
            }

            function spinWheel() {
                if (isSpinning || names.length < 2) {
                    if (names.length < 2) {
                        showMessage('أضف اسمين على الأقل للتدوير');
                        openModal(namesModal);
                    }
                    return;
                }

                isSpinning = true;
                mainSpinBtn.disabled = true;
                openNamesBtn.disabled = true;
                winnerDisplay.classList.remove('winner-pop');
                winnerDisplay.textContent = 'جاري السحب...';
                statusSubText.textContent = 'حظاً موفقاً للجميع';

                const extraSpins = 6 + Math.random() * 5;
                const targetRotation = currentAngle + extraSpins * Math.PI * 2 + Math.random() * Math.PI * 2;
                const startRotation = currentAngle;
                const duration = 4200;
                const startTime = performance.now();

                function animate(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 4);
                    currentAngle = startRotation + (targetRotation - startRotation) * easeOut;

                    drawWheel();

                    const currentIndex = getSelectedIndex();
                    if (currentIndex !== lastSliceIndex) {
                        playTickSound();
                        lastSliceIndex = currentIndex;
                    }

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        finishSpin();
                    }
                }

                requestAnimationFrame(animate);
            }

            function finishSpin() {
                isSpinning = false;
                mainSpinBtn.disabled = false;
                openNamesBtn.disabled = false;

                const winnerIndex = getSelectedIndex();
                const winnerName = names[winnerIndex];

                winnerDisplay.textContent = winnerName;
                winnerDisplay.classList.add('winner-pop');
                statusSubText.textContent = '🎉 الفائز المختار';
                playWinSound();
                launchConfetti();

                if (settings.vibrate && navigator.vibrate) {
                    navigator.vibrate([40, 30, 60]);
                }

                // إضافة الفائز للسجل
                history.unshift({ name: winnerName, time: new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' }) });
                if (history.length > 25) history.pop();
                saveHistory();
            }

            function saveAndRender() {
                try {
                    localStorage.setItem('iphone_wheel_names_v2', JSON.stringify(names));
                } catch (e) {}

                countBadge.textContent = `${names.length} ${names.length === 1 ? 'اسم' : names.length === 2 ? 'اسمان' : names.length <= 10 ? 'أسماء' : 'اسم'}`;
                renderNamesList();
                drawWheel();
            }

            function saveHistory() {
                try {
                    localStorage.setItem('iphone_wheel_history_v2', JSON.stringify(history));
                } catch (e) {}
            }

            function renderNamesList() {
                namesListEl.innerHTML = '';
                names.forEach((name, index) => {
                    const item = document.createElement('div');
                    item.className = 'list-item';

                    const rightPart = document.createElement('div');
                    rightPart.className = 'flex items-center overflow-hidden';

                    const dot = document.createElement('span');
                    dot.className = 'name-dot';
                    dot.style.backgroundColor = SLICE_COLORS[index % SLICE_COLORS.length];

                    const text = document.createElement('span');
                    text.className = 'truncate text-white';
                    text.textContent = name;

                    rightPart.appendChild(dot);
                    rightPart.appendChild(text);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.type = 'button';
                    delBtn.innerHTML = '✕';
                    delBtn.onclick = () => {
                        if (names.length <= 2) {
                            showMessage('يجب بقاء اسمين على الأقل في العجلة');
                            return;
                        }
                        names.splice(index, 1);
                        saveAndRender();
                    };

                    item.appendChild(rightPart);
                    item.appendChild(delBtn);
                    namesListEl.appendChild(item);
                });
            }

            function renderHistoryList() {
                historyListEl.innerHTML = '';
                if (history.length === 0) {
                    historyListEl.innerHTML = '<div class="text-center text-gray-400 py-6 font-bold text-sm">لا يوجد فائزون في السجل بعد</div>';
                    return;
                }
                history.forEach((item) => {
                    const row = document.createElement('div');
                    row.className = 'list-item flex justify-between items-center';
                    row.innerHTML = `<span class="font-extrabold text-amber-400">${item.name}</span><span class="text-xs text-gray-400 font-bold">${item.time}</span>`;
                    historyListEl.appendChild(row);
                });
            }

            function showMessage(msg) {
                inlineMessage.textContent = msg;
                inlineMessage.style.opacity = '1';
                setTimeout(() => { inlineMessage.style.opacity = '0'; }, 2500);
            }

            function openModal(modal) {
                if (isSpinning) return;
                if (modal === namesModal) renderNamesList();
                if (modal === historyModal) renderHistoryList();
                modal.classList.add('active');
            }

            function closeModal(modal) {
                modal.classList.remove('active');
                newNameInput.blur();
            }

            // ربط الأحداث
            mainSpinBtn.addEventListener('click', spinWheel);
            centerSpinBtn.addEventListener('click', spinWheel);

            openNamesBtn.addEventListener('click', () => openModal(namesModal));
            closeNamesModal.addEventListener('click', () => closeModal(namesModal));

            openHistoryBtn.addEventListener('click', () => openModal(historyModal));
            closeHistoryModal.addEventListener('click', () => closeModal(historyModal));

            openSettingsBtn.addEventListener('click', () => openModal(settingsModal));
            closeSettingsModal.addEventListener('click', () => closeModal(settingsModal));

            loadPresetBtn.addEventListener('click', () => openModal(presetModal));
            closePresetModal.addEventListener('click', () => closeModal(presetModal));

            document.querySelectorAll('.preset-choice').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const type = e.currentTarget.getAttribute('data-preset');
                    if (type === 'students') names = ['أحمد', 'محمد', 'فاطمة', 'سارة', 'خالد'];
                    if (type === 'yesno') names = ['نعم', 'لا', 'ربما', 'بالتأكيد'];
                    if (type === 'numbers') names = ['الخيار 1', 'الخيار 2', 'الخيار 3', 'الخيار 4'];
                    saveAndRender();
                    closeModal(presetModal);
                    showMessage('تم تحميل القائمة بنجاح');
                });
            });

            [namesModal, historyModal, settingsModal, presetModal].forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeModal(modal);
                });
            });

            addNameForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const val = newNameInput.value.trim();
                if (!val) return;
                names.push(val);
                newNameInput.value = '';
                saveAndRender();
                namesListEl.scrollTop = namesListEl.scrollHeight;
            });

            resetDefaultBtn.addEventListener('click', () => {
                names = [...DEFAULT_NAMES];
                winnerDisplay.textContent = 'عجلة الحظ';
                statusSubText.textContent = 'اضغط للتدوير واختيار الفائز';
                saveAndRender();
                showMessage('تمت استعادة الأسماء الافتراضية');
            });

            clearHistoryBtn.addEventListener('click', () => {
                history = [];
                saveHistory();
                renderHistoryList();
                showMessage('تم مسح السجل');
            });

            window.addEventListener('resize', setupCanvasSize);
            window.addEventListener('load', () => {
                setupCanvasSize();
                saveAndRender();
            });
        })();
    </script>
</body>
</html>
